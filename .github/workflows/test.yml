name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y python3-pip iproute2
      - name: Install bgpq4 and bird2
        run: |
          sudo apt update -y
          sudo apt install -y bgpq4 bird2

      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: false

      - uses: actions/checkout@v3

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          args: -E gosec

      - run: go get -v -t -d ./...
      - name: Start BIRD and configure permissions
        run: |
          # sudo systemctl enable --now bird
          # sudo systemctl is-active --quiet bird
          sudo install -d -m 0755 /etc/bird /run/bird

          # Install the example configuration
          sudo tee /etc/bird/bird.conf >/dev/null <<'EOF'
          log stderr all;
          router id 192.0.2.1;

          protocol device {
          }

          protocol static {
              ipv4;
          }
          EOF

          # Validate the configuration
          sudo bird -p -c /etc/bird/bird.conf

          # Start BIRD directly (no systemd required)
          sudo bird -c /etc/bird/bird.conf -s /run/bird/bird.ctl

          # Wait for the control socket
          for i in {1..20}; do
            [ -S /run/bird/bird.ctl ] && break
            sleep 0.25
          done

          test -S /run/bird/bird.ctl
          sudo chown "$(whoami):$(whoami)" /run/bird/bird.ctl
          sudo chown -R $(whoami):$(whoami) /etc/bird/
      - run: go generate -x
      - run: go build -v .
      - run: make dep
      - run: make test-setup
      - run: make test

      - name: Upload coverage report
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt

      - run: make test-teardown
